# Principal informations
name = "worker_name"
main = "src/index.js"
compatibility_date = "2026-07-19"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Static site
[assets]
directory = "./src/frontend"
binding = "ASSETS"

# Secret Store bindings (Cloudflare Secret Store du compte cible)
# Le store_id est injecté automatiquement par l'outil de déploiement
# (update-client-account) via la variable d'environnement SECRET_STORE_ID.
# Remplacer "__SECRET_STORE_ID__" par l'ID réel du Secret Store si vous ne
# passez pas par l'outil de déploiement automatique.
# Les valeurs des secrets doivent être définies dans le Secret Store Cloudflare
# (via le dashboard ou wrangler) sous les noms MAIN_USERNAME et MAIN_PASSWORD.
[[secrets_store_secrets]]
binding = "MAIN_USERNAME"
store_id = "__SECRET_STORE_ID__"
secret_name = "MAIN_USERNAME"

[[secrets_store_secrets]]
binding = "MAIN_PASSWORD"
store_id = "__SECRET_STORE_ID__"
secret_name = "MAIN_PASSWORD"

# Observability
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
