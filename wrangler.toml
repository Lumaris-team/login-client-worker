# Principal informations
name = "worker_name"
main = "src/index.js"
compatibility_date = "2026-07-19"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[vars]
WORKERS_ACCOUNT_SUBDOMAIN = "danielersen-cloudflare-account"

# Static site
[assets]
directory = "./src/frontend"
binding = "ASSETS"

# Observability
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
